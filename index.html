<style>
:root{--navy:#12344A;--ink:#12344A;--ink2:#52616B;--bg:#E8EFF2;--line:#D3DFE5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
.bar h1{margin:0;font-size:.9rem;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;font:inherit;font-size:.82rem;font-weight:500;color:var(--ink2);padding:0 14px;min-height:38px;border-radius:8px;cursor:pointer;transition:background-color .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.seg button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.size{font-size:.78rem;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:24px}
.frame{background:#fff;transition:width .35s cubic-bezier(.2,.7,.2,1),height .35s cubic-bezier(.2,.7,.2,1),border-radius .35s;box-shadow:0 30px 60px -30px rgba(18,52,74,.45);overflow:hidden;flex:none}
.frame iframe{display:block;width:100%;height:100%;border:0}
body[data-mode="desktop"] .stage{padding:0}
body[data-mode="desktop"] .frame{width:100%;height:100%;box-shadow:none;border-radius:0}
body[data-mode="tablet"] .frame{width:768px;height:min(1024px,calc(100% - 8px));border-radius:22px;border:10px solid #0D2838}
body[data-mode="mobile"] .frame{width:410px;height:min(864px,calc(100% - 8px));border-radius:44px;border:10px solid #0D2838}
body[data-mode="mobile360"] .frame{width:380px;height:min(760px,calc(100% - 8px));border-radius:40px;border:10px solid #0D2838}
@media (max-width:640px){.bar h1,.size{display:none}.bar{justify-content:center}.stage{padding:12px}}
</style>

<script>
(function(){
  var bytes = Uint8Array.from(atob(document.getElementById("src").textContent.trim()), function(c){ return c.charCodeAt(0); });
  var iframe = document.getElementById("lp");
  iframe.srcdoc = new TextDecoder("utf-8").decode(bytes);
  var labels = {desktop:"largura total", tablet:"768 × 1024", mobile:"390 × 844", mobile360:"360 × 740"};
  var btns = [].slice.call(document.querySelectorAll(".seg button"));
  function set(mode){
    if (!labels[mode]) mode = "desktop";
    document.body.dataset.mode = mode;
    btns.forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.mode === mode)); });
    var sz = document.getElementById("size"); if (sz) sz.textContent = labels[mode];
  }
  btns.forEach(function(b){ b.addEventListener("click", function(){ location.hash = b.dataset.mode; }); });
  window.addEventListener("hashchange", function(){ set(location.hash.slice(1)); });
  set(location.hash.slice(1));
})();
</script>
